[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "fraudgraph-agent"
version = "0.1.0"
description = "Agentic fraud investigation system powered by TigerGraph and GraphRAG"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # HTTP / async
    "httpx>=0.27,<1.0",
    "anyio>=4.6,<5.0",
    # Configuration / environment
    "python-dotenv>=1.0,<2.0",
    # Data processing
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "pyarrow>=17.0,<22.0",
    # TigerGraph
    "pyTigerGraph>=1.8,<2.0",
    # Agent / LLM
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    # Graph / scientific utilities
    "networkx>=3.3,<4.0",
    # Document processing
    "pypdf>=5.0,<7.0",
    # Structured logging
    "structlog>=24.4,<26.0",
    # Retry / resilience
    "tenacity>=9.0,<10.0",
    # IDs / utilities
    "uuid6>=2024.7.10",
    # Security
    "PyJWT>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "joblib>=1.6.0",
]


[project.optional-dependencies]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]


[project.scripts]
fraudgraph-api = "backend.app.main:run"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
include = [
    "backend*",
]


[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "data",
    "outputs",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

ignore = [
    "B008",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true


[tool.pytest.ini_options]
testpaths = [
    "backend/tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
]
